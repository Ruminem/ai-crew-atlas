# SPDX-License-Identifier: Apache-2.0
# 매일 도는 조사 루틴(refresh 스킬)의 PR 을 사람 손 없이 merge 한다.
# 루틴이 고치는 파일만 바뀌었고 페이지가 빌드되면 merge 하고, 아니면 PR 을 그대로 두어 사람이 본다.
# 사실 주장 자체는 검사하지 않는다 — 틀린 값은 PR·커밋 단위로 되돌린다.
name: routine-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: routine-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: >-
      startsWith(github.event.pull_request.title, '[routine:atlas-refresh]')
      && github.event.pull_request.user.login == 'Ruminem'
      && startsWith(github.head_ref, 'claude/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write        # merge
      pull-requests: write   # merge
      actions: write         # pages 를 다시 돌림
    steps:
      # pull_request 는 main 과 합친 merge 커밋을 꺼낸다. HEAD^1 이 main, HEAD^1..HEAD 가 merge 로 들어갈 변경이다.
      # 충돌이 나면 merge 커밋이 없어 여기서 실패하고 PR 은 사람 몫으로 남는다
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 루틴이 고치는 파일만 바뀌었는지
        run: |
          bad=$(git diff --name-only HEAD^1 HEAD | grep -vxE 'TOOLS\.md|CHANGELOG\.md|CLAUDE\.md' || true)
          if [ -n "$bad" ]; then echo "::error::루틴이 고치지 않는 파일이 바뀜: $bad"; exit 1; fi
          # CLAUDE.md 는 에이전트 시간 표에 행을 덧붙이는 것만 받는다. 규칙 문장은 사람이 본다
          odd=$(git diff -U0 HEAD^1 HEAD -- CLAUDE.md | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) [ab/]' \
            | grep -vE '^\+\| [0-9]{4}-[0-9]{2}-[0-9]{2} \| 매일 재확인 · [^|]+ \| [^|]+ \| [0-9]+ \|$' || true)
          if [ -n "$odd" ]; then printf '::error::CLAUDE.md 에 시간 표 행이 아닌 변경:\n%s\n' "$odd"; exit 1; fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run lint:design
        working-directory: site
      - run: npm run build
        working-directory: site
      # GITHUB_TOKEN 으로 한 merge 는 push 이벤트를 안 일으켜 pages 가 안 돈다. workflow_dispatch 는 예외라 직접 부른다
      - name: merge 하고 페이지 다시 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$HEAD_SHA"
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
