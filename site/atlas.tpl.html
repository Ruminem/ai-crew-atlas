<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --surface-2: #eceff4;
  --ink: #1a2031;
  --muted: #566074;
  --faint: #8790a2;
  --line: #dce1e9;
  --accent: #2a4fc4;
  --accent-soft: #e4eafb;
  --note-bg: #fff8e1;
  --note-line: #e3b341;
  --head-bg: rgba(244, 245, 248, .88);
  --scrim: rgba(12, 16, 28, .42);
  --shadow: 0 1px 2px rgba(18, 28, 56, .06), 0 10px 28px rgba(18, 28, 56, .12);
  --plate: #fbfcfd;
  --plate-line: #dce1e9;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --f-head: "Hahmlet", "AppleMyungjo", "Noto Serif KR", "Batang", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
/* 기본은 밝은 화면. 시스템·호스트의 다크 설정을 따라가지 않고 머리 띠의 단추로만 켠다 */
:root[data-atlas-theme="dark"] {
  --bg: #0e1219;
  --surface: #161b25;
  --surface-2: #1e2431;
  --ink: #e3e7ef;
  --muted: #9aa4b6;
  --faint: #6d788c;
  --line: #2a3242;
  --accent: #8fabff;
  --accent-soft: #1d2842;
  --note-bg: #2a2412;
  --note-line: #9c7a22;
  --head-bg: rgba(14, 18, 25, .86);
  --scrim: rgba(0, 0, 0, .55);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .45);
  --plate: #f3f5f8;
  --plate-line: #3a4356;
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* 브라우저가 스스로 해시로 스크롤할 때(불러오기가 끝난 뒤 한 번 더 한다)도 제목이 머리 띠에 안 깔리게. 52px 띠 + 12px */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-top: calc(var(--safe-t) + 64px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.72 var(--f-body);
  word-break: keep-all;
  overflow-wrap: break-word;
  -webkit-tap-highlight-color: transparent;
}
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code { font-family: var(--f-mono); font-size: .86em; background: var(--surface-2); padding: .12em .38em; border-radius: 5px; }
b, strong { font-weight: 600; }

/* 머리 띠 */
.top {
  position: -webkit-sticky;
  position: sticky;
  top: var(--safe-t);
  z-index: 30;
  background: var(--head-bg);
  -webkit-backdrop-filter: saturate(1.4) blur(10px);
  backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: 1180px;
  margin: 0 auto;
  height: 52px;
  padding: 0 calc(16px + var(--safe-r)) 0 calc(16px + var(--safe-l));
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand { font: 700 1.05rem/1 var(--f-head); letter-spacing: -.01em; white-space: nowrap; }
.brand small { font: 500 .72rem/1 var(--f-mono); color: var(--faint); margin-left: 8px; letter-spacing: 0; }
.theme-btn {
  flex: none;
  width: 44px; height: 44px;
  margin-right: -8px;
  border: 0; border-radius: 50%;
  background: none; color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0;
}
.theme-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.theme-btn .sun, [data-atlas-theme="dark"] .theme-btn .moon { display: none; }
[data-atlas-theme="dark"] .theme-btn .sun { display: block; }
.stamp { margin-left: auto; font: 400 .72rem/1.2 var(--f-mono); color: var(--muted); text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 판 */
.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 calc(16px + var(--safe-r)) 0 calc(16px + var(--safe-l));
}
main { min-width: 0; max-width: 820px; padding: 4px 0 calc(120px + var(--safe-b)); }
@media (min-width: 1100px) {
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 272px; gap: 56px; padding: 0 32px; }
}

/* 제목 */
h1 { font: 700 clamp(1.9rem, 1.3rem + 2.2vw, 2.7rem)/1.2 var(--f-head); letter-spacing: -.02em; margin: 32px 0 12px; }
h2, h3, h4 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 0; }
h2 { font: 700 1.5rem/1.35 var(--f-head); letter-spacing: -.01em; padding: 40px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
h3 { font-size: 1.2rem; font-weight: 700; line-height: 1.4; padding: 30px 0 8px; }
h4 { font-size: 1.02rem; font-weight: 600; line-height: 1.45; padding: 20px 0 4px; }
.num { font: 500 .78em/1 var(--f-mono); color: var(--accent); text-decoration: none; padding: 4px 0; }
.num:hover { text-decoration: underline; }
.ht {
  -webkit-appearance: none; appearance: none;
  background: none; border: 0; margin: 0; padding: 2px 0;
  font: inherit; color: inherit; letter-spacing: inherit; text-align: left;
  cursor: pointer; display: inline-flex; align-items: baseline; gap: 8px;
}
.ht::after { content: "▾"; font-size: .62em; color: var(--faint); transform: translateY(-.1em); }
.folded > h2 .ht::after, .folded > h3 .ht::after, .folded > h4 .ht::after { content: "▸"; }
.folded > h2, .folded > h3, .folded > h4 { color: var(--muted); }
.s.folded > .sb { display: none; }
.s-toc > h2 { border-bottom: 0; padding-bottom: 6px; }

.chip { font: 600 .72rem/1 var(--f-body); padding: 5px 9px; border-radius: 999px; border: 1px solid; align-self: center; letter-spacing: .02em; }
.r-claude   { background: #fbe3d6; border-color: #d9774a; color: #5a2a12; }
.r-general  { background: #dde8fb; border-color: #4c7bd9; color: #1b2e57; }
.r-research { background: #eae2fb; border-color: #8664d6; color: #2e1f57; }
.r-collect  { background: #d6f1ea; border-color: #2e9e86; color: #0f3d33; }
.r-create   { background: #fbe0ec; border-color: #d6508a; color: #571b35; }
.r-publish  { background: #fcefd2; border-color: #d29a2e; color: #573f0f; }
.r-record   { background: #e2f2d9; border-color: #5aa44a; color: #1f3d17; }

/* 본문 */
p { margin: 10px 0; }
ul, ol { padding-left: 1.35em; margin: 10px 0; }
li { margin: 4px 0; }
li > ul { margin: 4px 0; }
.s-toc > .sb {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 18px;
}
.hint { color: var(--muted); font-size: .9rem; }
blockquote {
  margin: 14px 0;
  padding: 10px 16px;
  background: var(--note-bg);
  border-left: 3px solid var(--note-line);
  border-radius: 0 10px 10px 0;
}
blockquote p { margin: 6px 0; }
.navrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 12px; }
.navrow a { text-decoration: none; }
a > kbd {
  display: inline-flex;
  align-items: center;
  min-height: 34px;
  padding: 4px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font: 500 .84rem/1.2 var(--f-body);
  box-shadow: 0 1px 0 var(--line);
}

/* 표: 표 안에서만 가로로 밀린다 */
.table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
  margin: 14px 0;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
}
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: .9rem; line-height: 1.55; }
th, td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
td { min-width: 9em; }
th { background: var(--surface-2); font-weight: 600; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
th:first-child, td:first-child {
  position: -webkit-sticky;
  position: sticky;
  left: 0;
  z-index: 1;
  min-width: 6.5em;
  background: var(--surface);
  border-right: 1px solid var(--line);
}
th:first-child { background: var(--surface-2); z-index: 2; }

/* 관계도: 어두운 화면에서도 밝은 판 위에 그린다 (그림 테마가 밝은 바탕 기준) */
.diagram {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin: 14px 0 22px;
  padding: 16px;
  background: var(--plate);
  border: 1px solid var(--plate-line);
  border-radius: 12px;
  color: #1f2328;
}
.diagram pre.mermaid { margin: 0; font: 12px/1.5 var(--f-mono); color: #57606a; white-space: pre; background: none; }
.diagram svg { display: block; margin: 0 auto; height: auto; }
@media (max-width: 700px) {
  .diagram svg { max-width: none !important; min-width: 600px; }
}

.foot { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: .84rem; }
.foot p { margin: 4px 0; }

/* 목차 */
.toc ul { list-style: none; margin: 0; padding: 0; }
.toc ul ul { padding-left: 14px; }
.toc li { margin: 0; }
.toc a {
  display: flex;
  gap: 8px;
  padding: 6px 10px;
  border-radius: 8px;
  color: var(--muted);
  text-decoration: none;
  font-size: .88rem;
  line-height: 1.4;
}
.toc a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.toc li.t2 > a { color: var(--ink); font-weight: 600; }
.toc li.t2 > a.active { color: var(--accent); }
.toc li.t4 { display: none; }
.toc li.open > ul > li.t4 { display: block; }
.tn { font: 500 .78rem/1.55 var(--f-mono); color: var(--faint); flex: none; }
.toc a.active .tn { color: inherit; }
.toc-head { display: flex; align-items: center; justify-content: space-between; padding: 0 10px 8px; }
.toc-head strong { font: 700 .95rem/1 var(--f-head); }
.toc-x {
  display: none;
  width: 44px; height: 44px;
  border: 0; border-radius: 50%;
  background: none; color: var(--muted);
  cursor: pointer; padding: 0;
  align-items: center; justify-content: center;
}
.grab { display: none; }
.scrim { display: none; }

@media (min-width: 1100px) {
  .toc {
    position: -webkit-sticky;
    position: sticky;
    top: calc(52px + var(--safe-t) + 24px);
    align-self: start;
    margin-top: 40px;
    max-height: calc(100vh - 52px - var(--safe-t) - 48px);
    display: flex;
    flex-direction: column;
  }
  .toc-list { overflow-y: auto; overscroll-behavior: contain; border-left: 1px solid var(--line); padding: 2px 0 2px 8px; }
  .fab-toc { display: none !important; }
}
@media (max-width: 1099.98px) {
  .toc {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 50;
    margin: 0 auto;
    max-width: 640px;
    max-height: 80vh;
    max-height: 80dvh;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-radius: 18px 18px 0 0;
    box-shadow: var(--shadow);
    padding: 8px calc(8px + var(--safe-r)) var(--safe-b) calc(8px + var(--safe-l));
    transform: translateY(105%);
    visibility: hidden;
    transition: transform .28s cubic-bezier(.2, .8, .2, 1), visibility 0s linear .28s;
  }
  .toc.open { transform: none; visibility: visible; transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
  .grab { display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 2px auto 6px; }
  .toc-x { display: inline-flex; }
  .toc-list { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 0 4px 16px; }
  .toc a { padding: 10px 12px; font-size: .95rem; }
  .scrim {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 45;
    background: var(--scrim);
    opacity: 0;
    visibility: hidden;
    touch-action: none;
    transition: opacity .28s, visibility 0s linear .28s;
  }
  .scrim.show { opacity: 1; visibility: visible; transition: opacity .28s; }
}

/* 떠 있는 단추 */
.fabs {
  position: fixed;
  right: calc(16px + var(--safe-r));
  bottom: calc(16px + var(--safe-b));
  z-index: 40;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.fab {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0;
}
.fab svg, .toc-x svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

@media (max-width: 480px) {
  body { font-size: 15.5px; }
  h2 { font-size: 1.36rem; padding-top: 32px; }
  h3 { font-size: 1.12rem; }
  .brand small { display: none; }
}
/* 터치 기기는 탭한 뒤 hover 가 남아 단추가 눌린 채로 보이므로 마우스가 있을 때만 켠다 */
@media (hover: hover) {
  .theme-btn:hover { background: var(--surface-2); color: var(--ink); }
  a:hover > kbd { border-color: var(--accent); color: var(--accent); }
  .toc a:not(.active):hover { background: var(--surface-2); color: var(--ink); }
  .toc-x:hover { background: var(--surface-2); }
  .fab:hover { color: var(--accent); border-color: var(--accent); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
}
</style>

// 본문이 그려지기 전에 고른 테마를 입혀 밝게 한 번 번쩍이지 않게 한다. 저장 못 하는 브라우저면 늘 밝게
(function () {
  var dark = false;
  try { dark = localStorage.getItem('atlas-theme') === 'dark'; } catch (e) {}
  if (dark) document.documentElement.setAttribute('data-atlas-theme', 'dark');
  document.getElementById('theme-btn').setAttribute('aria-pressed', String(dark));
})();
</script>

<script>
(function () {
  var toc = document.getElementById('toc');
  var list = document.getElementById('toc-list');
  var scrim = document.getElementById('scrim');
  var fabToc = document.getElementById('fab-toc');
  var closeBtn = document.getElementById('toc-x');
  var header = document.querySelector('.top');
  var wide = window.matchMedia('(min-width: 1100px)');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  function dec(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }
  function behavior() { return reduce.matches ? 'auto' : 'smooth'; }
  function headerBottom() { return header.getBoundingClientRect().bottom; }

  // 목차 링크와 본문 제목을 짝짓는다
  var entries = [];
  Array.prototype.forEach.call(list.querySelectorAll('a[href^="#"]'), function (a) {
    var h = document.getElementById(dec(a.getAttribute('href').slice(1)));
    if (h) entries.push([h, a]);
  });

  function setFold(section, folded) {
    section.classList.toggle('folded', folded);
    var b = section.firstElementChild && section.firstElementChild.querySelector('.ht');
    if (b) b.setAttribute('aria-expanded', String(!folded));
  }
  function unfoldTo(el) {
    for (var s = el.closest('.s'); s; s = s.parentElement && s.parentElement.closest('.s')) setFold(s, false);
  }

  function jump(id, how) {
    var el = document.getElementById(id);
    if (!el) return false;
    unfoldTo(el);
    closeToc(false);
    var y = el.getBoundingClientRect().top + window.pageYOffset - headerBottom() - 12;
    window.scrollTo({ top: Math.max(0, y), behavior: how === 'load' ? 'auto' : behavior() });
    if (how === 'push') {
      try { history.pushState(null, '', '#' + id); } catch (e) {}
    }
    return true;
  }

  var lastFocus = null;
  function openToc() {
    if (wide.matches) return;
    lastFocus = document.activeElement;
    toc.classList.add('open');
    scrim.classList.add('show');
    fabToc.setAttribute('aria-expanded', 'true');
    reveal();
    closeBtn.focus({ preventScroll: true });
  }
  function closeToc(restoreFocus) {
    if (!toc.classList.contains('open')) return;
    toc.classList.remove('open');
    scrim.classList.remove('show');
    fabToc.setAttribute('aria-expanded', 'false');
    if (restoreFocus !== false && lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#"]');
    if (a) {
      var id = dec(a.getAttribute('href').slice(1));
      if (id && jump(id, 'push')) e.preventDefault();
      return;
    }
    var ht = e.target.closest('.ht');
    if (ht) {
      var s = ht.closest('.s');
      setFold(s, !s.classList.contains('folded'));
      queue();
    }
  });
  fabToc.addEventListener('click', function () { toc.classList.contains('open') ? closeToc() : openToc(); });
  closeBtn.addEventListener('click', function () { closeToc(); });
  scrim.addEventListener('click', function () { closeToc(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeToc(); });
  document.getElementById('fab-up').addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: behavior() });
  });
  document.getElementById('fab-down').addEventListener('click', function () {
    window.scrollTo({ top: document.documentElement.scrollHeight, behavior: behavior() });
  });
  document.getElementById('theme-btn').addEventListener('click', function () {
    var root = document.documentElement;
    var dark = root.getAttribute('data-atlas-theme') !== 'dark';
    if (dark) root.setAttribute('data-atlas-theme', 'dark'); else root.removeAttribute('data-atlas-theme');
    this.setAttribute('aria-pressed', String(dark));
    try { localStorage.setItem('atlas-theme', dark ? 'dark' : 'light'); } catch (e) {}
  });
  function onWide() { if (wide.matches) closeToc(false); }
  if (wide.addEventListener) wide.addEventListener('change', onWide); else wide.addListener(onWide);
  window.addEventListener('popstate', function () {
    var id = dec(location.hash.slice(1));
    if (id) jump(id, 'pop');
  });

  // 지금 읽는 절을 목차에서 밝힌다
  var current = null;
  function reveal() {
    if (!current) return;
    var r = current.getBoundingClientRect(), b = list.getBoundingClientRect();
    if (!b.height) return;
    if (r.top < b.top + 8 || r.bottom > b.bottom - 8) list.scrollTop += (r.top - b.top) - b.height / 3;
  }
  function spy() {
    ticking = false;
    var line = headerBottom() + 24, pick = null, lastVisible = null;
    for (var i = 0; i < entries.length; i++) {
      var h = entries[i][0];
      if (!h.offsetParent) continue;
      lastVisible = entries[i][1];
      if (h.getBoundingClientRect().top <= line) pick = entries[i][1];
    }
    var doc = document.documentElement;
    if (window.innerHeight + window.pageYOffset >= doc.scrollHeight - 2 && lastVisible) pick = lastVisible;
    if (pick === current) return;
    if (current) { current.classList.remove('active'); current.removeAttribute('aria-current'); }
    Array.prototype.forEach.call(list.querySelectorAll('li.open'), function (li) { li.classList.remove('open'); });
    current = pick;
    if (!current) return;
    current.classList.add('active');
    current.setAttribute('aria-current', 'location');
    for (var li = current.closest('li'); li; li = li.parentElement && li.parentElement.closest('li')) li.classList.add('open');
    reveal();
  }
  var ticking = false;
  function queue() { if (!ticking) { ticking = true; requestAnimationFrame(spy); } }
  window.addEventListener('scroll', queue, { passive: true });
  window.addEventListener('resize', queue);

  var start = '';
  try { start = dec(location.hash.slice(1)); } catch (e) {}
  if (start) requestAnimationFrame(function () { jump(start, 'load'); queue(); });
  queue();
})();
</script>
