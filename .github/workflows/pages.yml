# SPDX-License-Identifier: Apache-2.0
# main 에 TOOLS.md · CHANGELOG.md · site/ 가 바뀌어 들어오면 웹 페이지를 다시 만들어 GitHub Pages 에 올린다.
# site/dist/ 는 커밋하지 않는다 — 여기서 만들어 바로 배포한다.
name: pages

on:
  push:
    branches: [main]
    paths: [TOOLS.md, CHANGELOG.md, 'site/**', .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read      # 올릴 권한은 아래 deploy 잡에만 준다

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 무료 요금제의 Pages 는 public 저장소에서만 켜진다. private 인 동안은 빨간 불 대신 건너뛴다
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # 머리 띠의 날짜·해시를 git log -- TOOLS.md 로 읽는다. 얕은 클론이면 비거나 틀린다
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
